<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}BedBoard admin{% endblock %}</title>
  <style>
    :root { color-scheme: light; }
    body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; color: #1a1a1a; }
    nav { margin-bottom: 1.5rem; padding-bottom: .75rem; border-bottom: 1px solid #ddd; }
    nav a { margin-right: 1rem; color: #0a5; text-decoration: none; font-weight: 600; }
    nav a:hover { text-decoration: underline; }
    h1 { font-size: 1.4rem; }
    table { border-collapse: collapse; width: 100%; margin: 1rem 0; }
    th, td { text-align: left; padding: .4rem .6rem; border-bottom: 1px solid #eee; font-size: .92rem; }
    th { background: #fafafa; }
    tr.inactive { color: #999; }
    form.inline { display: inline; }
    .card { background: #fafafa; border: 1px solid #e5e5e5; border-radius: 6px; padding: 1rem 1.25rem; margin: 1rem 0; }
    label { display: block; font-size: .85rem; font-weight: 600; margin: .5rem 0 .2rem; }
    input, select { padding: .35rem .5rem; font-size: .9rem; border: 1px solid #ccc; border-radius: 4px; width: 100%; box-sizing: border-box; }
    .row { display: flex; gap: 1rem; flex-wrap: wrap; }
    .row > div { flex: 1; min-width: 160px; }
    button { margin-top: .75rem; padding: .4rem .9rem; border: none; border-radius: 4px; background: #0a5; color: white; font-weight: 600; cursor: pointer; }
    button.danger { background: #c33; }
    button.secondary { background: #888; }
    .flash { background: #eaffea; border: 1px solid #9c9; padding: .5rem .75rem; border-radius: 4px; margin-bottom: 1rem; font-size: .9rem; }
    .flash.error { background: #ffecec; border-color: #c99; }
    .muted { color: #888; font-size: .85rem; }
    code { background: #f0f0f0; padding: .1rem .3rem; border-radius: 3px; }
  </style>
</head>
<body>
  <nav>
    <strong>BedBoard admin</strong> &middot;
    <a href="/admin/coordinators">Coordinators</a>
    <a href="/admin/population-map">SMS population map</a>
  </nav>
  {% if flash %}<div class="flash{% if flash_error %} error{% endif %}">{{ flash }}</div>{% endif %}
  {% block content %}{% endblock %}
</body>
</html>
